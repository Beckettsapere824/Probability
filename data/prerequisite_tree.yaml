# prerequisite_tree.yaml — knowledge tree index (multipart)
# Full node content: data/tree/M0.yaml … M8.yaml + 00_meta + 99_study_order
# Single-file backup: data/prerequisite_tree.full.yaml (pushed separately if size allows)
# NODE_MAP: course/SDST2601A/NODE_MAP.md
# M8 stubs: nodes/M8.*.md
#
# Assemble: cat data/tree/00_meta.yaml data/tree/M{0..8}.yaml data/tree/99_study_order.yaml

meta:
  name: STAT2601_Exam2_Knowledge_Prerequisite_Tree
  format: structured_prerequisite_tree_multipart
  parts_dir: data/tree/
  modules:
    M0: 数学与记号基础
    M1: 概率基础与条件概率
    M2: 组合计数与抽样模型
    M3: 离散随机变量：期望、方差、变换
    M4: 常见离散分布与性质
    M5: 条件、贝叶斯与条件计数专题
    M6: 随机过程与长期频率
    M7: 应用模型与综合题
    M8: 连续分布与生存分析（来自 SDST2601A；内容待补）
