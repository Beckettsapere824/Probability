meta:
  name: STAT2601_Exam2_Knowledge_Prerequisite_Tree
  format: structured_prerequisite_tree
  usage:
    - "agent 按 prereq 做拓扑排序；未满足 prereq 时先学前置节点。"
    - "每个节点是可直接教学/检查的最小知识单元。"
    - "content 中的公式和步骤应能直接用于解题。"
  modules:
    M0: 数学与记号基础
    M1: 概率基础与条件概率
    M2: 组合计数与抽样模型
    M3: 离散随机变量：期望、方差、变换
    M4: 常见离散分布与性质
    M5: 条件、贝叶斯与条件计数专题
    M6: 随机过程与长期频率
    M7: 应用模型与综合题

nodes:
  # ================= M0 数学与记号基础 =================
  - id: M0.1
    name: 集合与事件语言
    prereq: []
    content:
      - 集合交并补、子集、空集、全集。
      - 互斥：A ∩ B = ∅；穷尽：A ∪ B = Ω。
      - De Morgan 律：(A ∪ B)^c = A^c ∩ B^c，(A ∩ B)^c = A^c ∪ B^c。
      - 把文字事件翻译成集合事件：至少一个、恰好一个、都不、至少两个、全部。
  - id: M0.2
    name: 计数两大原理
    prereq: [M0.1]
    content:
      - 加法原理：分类完成，类间互斥，总数相加。
      - 乘法原理：分步完成，每步选择数相乘。
      - 先判断：是否有顺序、是否可重复、对象是否可区分、是否允许空盒/空类。
  - id: M0.3
    name: 阶乘、排列、组合
    prereq: [M0.2]
    content:
      - n!、P(n,k)=n!/(n-k)!、C(n,k)=binom(n,k)=n!/[k!(n-k)!]。
      - C(n,k)=C(n,n-k)，C(n,0)=1。
      - 有序选取 vs 无序选取；分子分母必须同一口径。
      - 多类对象选取：各类组合数相乘。
  - id: M0.3a
    name: 组合数边界约定
    prereq: [M0.3]
    content:
      - 约定 C(n,k)=0，当 k<0 或 k>n。
      - C(n,0)=C(n,n)=1。
      - 用于 PMF 定义域、求和下限、容斥中“选不出”的情况。
      - 写次序统计量 PMF 或组合求和时，先明确 k 的合法范围。
  - id: M0.4
    name: 二项式系数恒等式
    prereq: [M0.3]
    content:
      - C(n,k)=C(n-1,k-1)+C(n-1,k)。
      - sum_{k=r}^m C(k,r)=C(m+1,r+1)（hockey-stick）。
      - C(n,k)/(k+1)=C(n+1,k+1)/(n+1)。
      - 这些恒等式用于化简组合求和、倒数期望、系数提取。
  - id: M0.4a
    name: 二项式定理与系数提取
    prereq: [M0.3, M0.4]
    content:
      - (a+b)^n = sum_{k=0}^n C(n,k) a^k b^{n-k}。
      - 特例：(1+x)^n = sum_{k=0}^n C(n,k)x^k。
      - 从 (1+x)^k 中提取 x^r 的系数为 C(k,r)。
      - 与 hockey-stick 联用：sum_{k=r}^m C(k,r)=C(m+1,r+1)。
      - 二项式定理也用于把 sum C(n,k)q^{n-k} 收成 (1+q)^n。
      - 多项式系数是二项式定理的推广。
  - id: M0.5
    name: 求和、级数、对数展开
    prereq: [M0.3]
    content:
      - 几何级数：sum_{k=0}^∞ r^k=1/(1-r)，|r|<1。
      - sum_{k=0}^∞ k r^{k-1}=1/(1-r)^2，|r|<1。
      - 对数展开：-ln(1-a)=sum_{i=1}^∞ a^i/i，-1<a<1。
      - 换元求和、逐项求导、交换求和与期望时先检查收敛。
      - 有限和与无限和要区分；无限和必须写收敛条件。
  - id: M0.5a
    name: 有限几何级数
    prereq: [M0.5]
    content:
      - sum_{k=0}^{m} r^k=(1-r^{m+1})/(1-r)，r≠1。
      - sum_{k=1}^{m} r^{k-1}=(1-r^m)/(1-r)。
      - 补事件形式：1-(1-p)^m。
      - 有限和不需要 |r|<1；无限和才需要收敛条件。
      - 用于“最小 n 使概率大于阈值”、几何等待比较、有限次独立试验补事件。
  - id: M0.6
    name: 导数与泰勒/MGF 求导
    prereq: [M0.5]
    content:
      - 对参数求导、在 t=0 取值。
      - M_X^{(r)}(0)=E(X^r)。
      - 复合函数求导：d/dt ln(1-pe^t) = -pe^t/(1-pe^t)。
      - 求 MGF 的收敛域时解 |pe^t|<1。
      - 由 M'(0)、M''(0) 得均值和方差。
  - id: M0.7
    name: 绝对值、不等式与线性约束
    prereq: []
    content:
      - |X-μ|≤2σ 转成区间 [μ-2σ, μ+2σ]。
      - 对数不等式解 n：a^n < b 转 n ln a < ln b，注意底数大小与不等号方向。
      - 概率上界中的线性约束、非负约束、参数可行域。
      - 最大化参数时检查边界和可行性。
      - 绝对值方程/不等式要分正负讨论。
  - id: M0.8
    name: 矩阵与线性方程组
    prereq: []
    content:
      - 二状态转移矩阵、行和为 1。
      - 解线性方程组、归一化条件。
      - 矩阵乘法表示状态转移。
      - 平稳分布方程 πP=π，π 各分量非负且和为 1。
      - 吸收概率方程也用线性方程组。
  # ================= M1 概率基础与条件概率 =================
  - id: M1.1
    name: 样本空间、事件、概率公理
    prereq: [M0.1]
    content:
      - 样本空间 Ω、事件 A⊆Ω。
      - 0≤P(A)≤1，P(Ω)=1，P(∅)=0。
      - 有限等可能古典概型：P(A)=有利结果数/总结果数。
      - 可列可加性：互斥事件并的概率等于概率和。
  - id: M1.2
    name: 补事件、并交事件、包含排除
    prereq: [M1.1]
    content:
      - P(A^c)=1-P(A)。
      - P(A∪B)=P(A)+P(B)-P(A∩B)。
      - 三事件包含排除：
        P(A∪B∪C)=P(A)+P(B)+P(C)-P(A∩B)-P(A∩C)-P(B∩C)+P(A∩B∩C)。
      - P(A∩B)=0 表示互斥。
      - 差乘积为 0 等事件可拆成并事件再算。
      - 补事件常用于“至少一个”。
  - id: M1.2a
    name: 概率单调性、包含关系与概率上界
    prereq: [M1.1, M1.2]
    content:
      - 若 A⊆B，则 P(A)≤P(B)。
      - P(A∩B)≤min(P(A),P(B))。
      - P(A∪B∪C)≤1，且各交事件概率非负。
      - 由包含排除建立参数不等式：并概率≤1，交概率≤单个事件概率。
      - 用于求参数的最大可行值、概率上界、可行性检查。
  - id: M1.3
    name: 条件概率与乘法公式
    prereq: [M1.1]
    content:
      - P(A|B)=P(A∩B)/P(B)，P(B)>0。
      - P(A∩B)=P(A|B)P(B)=P(B|A)P(A)。
      - 条件概率仍满足概率公理。
      - 条件概率中分母是条件事件，不是全集。
      - 多个事件链式相乘：P(A∩B∩C)=P(A)P(B|A)P(C|A∩B)。
  - id: M1.3a
    name: 条件补事件与条件独立
    prereq: [M1.2, M1.3]
    content:
      - P(A^c|B)=1-P(A|B)。
      - 若 P(B'|D')=θ，则 P(B|D')=1-θ。
      - 条件独立：P(A∩B|C)=P(A|C)P(B|C)。
      - 条件独立与无条件独立不同；不能随意互换。
      - 条件概率下仍可用补事件、并交公式、包含排除。
  - id: M1.4
    name: 全概率公式
    prereq: [M1.3]
    content:
      - 设 A_i 互斥且穷尽，P(B)=sum_i P(B|A_i)P(A_i)。
      - 先按原因/类别分割，再对每类算条件概率。
      - 诊断测试先按患病/未患病分割。
      - 全概率公式是贝叶斯公式的分母。
      - 检查分割是否互斥且穷尽。
  - id: M1.5
    name: 贝叶斯公式
    prereq: [M1.3, M1.4]
    content:
      - P(A_i|B)=P(B|A_i)P(A_i)/sum_j P(B|A_j)P(A_j)。
      - 先验、似然、后验、归一化。
      - 后验概率与先验和似然比有关。
      - 反解阈值参数时，把后验写成参数的分式方程。
      - 基础率很低时后验可能远低于直觉。
  - id: M1.6
    name: 独立性
    prereq: [M1.3]
    content:
      - 两事件独立：P(A∩B)=P(A)P(B)。
      - 多个事件相互独立：任意子集的交概率等于各自概率乘积。
      - 独立与互斥不能随意混用；非空事件既独立又互斥通常不可能。
      - 独立时 P(A∪B)=1-(1-P(A))(1-P(B))。
      - 独立重复试验的联合概率逐项相乘。
  - id: M1.7
    name: 互斥、穷尽、等可能及其相容性
    prereq: [M1.2, M1.6]
    content:
      - 互斥：P(A∩B)=0。
      - 穷尽：A∪B=Ω。
      - 等可能：P(A)=P(B)。
      - 判断“既独立又互斥”何时可能：需要 P(A)P(B)=0，即至少一个概率为 0。
      - 判断“既互斥又穷尽”：A 与 A^c 是典型。
      - 判断“既独立又穷尽”：P(A∪B)=P(A)+P(B)-P(A)P(B)=1。
  - id: M1.8
    name: 随机变量、PMF、CDF
    prereq: [M1.1]
    content:
      - 离散随机变量 X 的取值。
      - PMF：p(x)=P(X=x)，sum_x p(x)=1，p(x)≥0。
      - CDF：F(x)=P(X≤x)=sum_{u≤x}p(u)。
      - F 单调不减、右连续，F(-∞)=0，F(+∞)=1。
      - 由 PMF 累加得 CDF；由 CDF 跳跃高度得 PMF。
      - 区间概率：P(a<X≤b)=F(b)-F(a)。
  - id: M1.8a
    name: PMF 同值合并与 CDF 阶梯构造
    prereq: [M1.8]
    content:
      - 不同样本结果可能映射到同一个 X=x，必须把概率合并，不能重复计。
      - 先列 X 的所有可能取值，再对每个值找对应样本组合。
      - CDF：F(x)=sum_{u≤x}p(u)，按 x 从小到大累加。
      - 阶梯函数在 x 处的跳跃高度为 p(x)，右连续。
      - 相邻取值之间 F 保持不变。
      - 检查 F(-∞)=0、F(+∞)=1、单调不减。
      - 写 CDF 时按取值区间分段。
  - id: M1.9
    name: 古典概型与等可能结果
    prereq: [M0.3, M1.1]
    content:
      - 概率=有利结果数/总结果数。
      - 先确定总样本空间是有序还是无序。
      - 分子分母口径必须一致。
      - 复杂事件先分解成简单事件再计数。
      - 等可能假设必须明确；非均匀骰子不能直接数结果数。
  - id: M1.10
    name: 随机变量独立、联合分布与边缘化
    prereq: [M1.6, M1.8]
    content:
      - 离散联合 PMF：p_{X,Y}(x,y)=P(X=x,Y=y)。
      - 边缘化：p_X(x)=sum_y p_{X,Y}(x,y)。
      - 独立随机变量：p_{X,Y}(x,y)=p_X(x)p_Y(y)。
      - 等价于 P(X∈A,Y∈B)=P(X∈A)P(Y∈B)。
      - 若 X,Y 独立，则 E[g(X)h(Y)]=E[g(X)]E[h(Y)]。
      - 期望线性性不需要独立。
      - 多个独立试验的联合概率逐项相乘。
  # ================= M2 组合计数与抽样模型 =================
  - id: M2.1
    name: 有序/无序、有放回/无放回
    prereq: [M0.3, M1.9]
    content:
      - 有序有放回：n^k。
      - 有序无放回：P(n,k)。
      - 无序无放回：C(n,k)。
      - 无序有放回：C(n+k-1,k)。
      - 先判断四格模型，再计数。
      - 抽样后是否放回影响分母和后续概率。
  - id: M2.2
    name: 子集选择与二进制选择
    prereq: [M0.3]
    content:
      - 每个元素选/不选，k 个可选对象有 2^k 种子集。
      - 配料组合：每种配料选或不选。
      - 允许空集和全集。
      - 两个对象可相同且无序时用多重集合计数，不是简单 2^k 平方。
  - id: M2.3
    name: stars-bars：非负整数解
    prereq: [M0.3]
    content:
      - x_1+...+x_r=n，x_i≥0 的解数 C(n+r-1,r-1)。
      - 方程解、不等式加松弛变量。
      - 变量可为零；若要求正数先换元。
      - 求和范围要按变量个数确定。
      - 与组合数边界约定联用。
  - id: M2.3a
    name: 整数解题的条件甄别
    prereq: [M2.3, M2.4, M2.5]
    content:
      - 先确认变量是“非负整数”“正整数”“整数”还是“有上下界整数”。
      - 非负解：C(n+r-1,r-1)；正整数解：令 y_i=x_i-1 后转非负。
      - 不等式 x+y+z<25 转 x+y+z≤24，再加松弛变量转等式。
      - 若和固定且上界大于和，则上界可能自动满足，不需要容斥；若上界小于和才需要容斥。
      - 题干写“integer solutions”但未写非负时，不能默认非负。
      - 答案与常规计数不符时，先回查是否漏了“非负/正/上界/不等式”条件。
  - id: M2.4
    name: 正整数解与不等式松弛
    prereq: [M2.3]
    content:
      - x_i≥1：令 y_i=x_i-1，转 y_i≥0。
      - x+y+z<25 转 x+y+z≤24，再加松弛变量 s≥0。
      - 正整数解数 C(n-1,r-1)。
      - 不等式解数等于加松弛后的等式解数。
      - 求和恒等式可化简多组解数相加。
  - id: M2.5
    name: 上界约束与容斥
    prereq: [M2.3, M1.2]
    content:
      - 先算无约束解，再减去 x_i≥a_i 的越界事件，加回交集。
      - x_i≤b_i 的容斥：总数 - sum 越界 + sum 两两越界 - ...
      - 越界换元：x_i'=x_i-(b_i+1)≥0。
      - 检查上界是否自动满足。
      - 多变量上界约束逐项容斥。
  - id: M2.6
    name: 容斥原理、非空盒子、满射计数
    prereq: [M1.2, M0.3]
    content:
      - 至少一个/恰好非空。
      - r 个盒全非空：sum_{j=0}^r (-1)^j C(r,j)(r-j)^n。
      - 同色球按颜色独立分配，再对盒非空容斥。
      - 不同颜色之间分配独立相乘。
      - 满射计数等价于全非空盒子分配。
  - id: M2.6a
    name: “恰好/至少/非空”的容斥转换
    prereq: [M2.6]
    content:
      - “恰好 k 个盒子非空”“至少一个盒子非空”“所有盒子非空”是不同事件。
      - 全非空：总数减去至少一个空盒，再容斥加回至少两个空盒……
      - 同色球不可区分时，先按颜色分别用 stars-bars 分配，再对盒子非空做容斥。
      - 不同颜色之间独立相乘。
      - “至少一人有球”=总数−全给同一人。
      - 写容斥时先定义坏事件 E_i=第 i 个盒子为空。
  - id: M2.7
    name: 随机排列与相对顺序
    prereq: [M0.3]
    content:
      - 随机排列中指定元素的相对次序等可能。
      - 固定指定 r 个元素的相对次序，其他元素任意。
      - 总排列数 n!，指定相对次序占 1/r!。
      - A 在 C 前且 C 在 E 前概率为 1/3!。
      - 忽略无关元素的相对顺序。
      - “before”不要求相邻。
  - id: M2.8
    name: 生日问题/占位模型
    prereq: [M1.9, M2.1]
    content:
      - n 个球入 m 盒总 m^n。
      - 无重复/无空盒用补事件或容斥。
      - 至少一盒多球：1 - 全不同概率。
      - 占位模型要求球可区分、盒可区分；否则换模型。
      - 生日问题中“重复”=至少两个同盒。
  - id: M2.9
    name: 分类无放回抽样与多元超几何
    prereq: [M0.3, M1.9]
    content:
      - 从白/黑/橙分类中抽两球，有利数=各类选数乘积。
      - 总样本数=C(总球数,抽样数)。
      - 无放回联合概率用组合数。
      - PMF 必须归一化。
      - 不同类别组合可能映射到同一个随机变量值，要合并。
  - id: M2.10
    name: 配对、夫妻、袜子鞋子计数
    prereq: [M2.9]
    content:
      - 先选完整配对，再从剩余配对中各选一只。
      - 区分“同色同款不可区分”和“左右鞋可区分/配对结构”。
      - 袜子题：同色同款不可区分；鞋子题：左右可区分但配对结构相同。
      - 夫妻选人恰一对：先选夫妻对，再从其他夫妻中各选一人且不能形成新夫妻对。
      - 注意“恰好一对”与“至少一对”区别。
  - id: M2.11
    name: 错排与恰好 k 个正确
    prereq: [M0.3, M1.9]
    content:
      - 错排 D_n=n! sum_{j=0}^n (-1)^j/j!。
      - 递推 D_n=(n-1)(D_{n-1}+D_{n-2})。
      - 恰好 k 个正确：选正确对象 C(n,k)，其余错排 D_{n-k}。
      - 至少 k 个正确用并/容斥。
      - D_n/n! → e^{-1}。
      - 错排数不要与全排列混淆。
  - id: M2.12
    name: 普通生成函数计数
    prereq: [M0.5, M2.1]
    content:
      - 每类约束对应因子。
      - 0/1 用 1+x。
      - 0..m 用 1+x+...+x^m。
      - 偶数用 1/(1-x^2)。
      - 正奇数用 x/(1-x^2)。
      - 3 的倍数用 1/(1-x^3)。
      - 总生成函数为各因子乘积，求 x^n 系数。
      - 系数可用二项式定理、几何级数、枚举展开。
  - id: M2.12a
    name: 生成函数因子的“至少/正/非负”区别
    prereq: [M2.12]
    content:
      - 非负偶数：1+x^2+x^4+...=1/(1-x^2)。
      - 正奇数：x+x^3+x^5+...=x/(1-x^2)。
      - 非负 3 的倍数：1+x^3+x^6+...=1/(1-x^3)。
      - 正 3 的倍数：x^3/(1-x^3)。
      - “至少一个”可通过把非负因子减去 1，或直接用正因子。
      - 多类独立选择：总生成函数为各因子乘积。
      - 取球题中“橙球必须取奇数个且至少一个”因子是 x/(1-x^2)，不是 1/(1-x^2)。
  - id: M2.13
    name: 网格路径与转向分段
    prereq: [M0.3]
    content:
      - 东北路径数 C(m+n,n)。
      - 恰三次转向=把路径分成 4 段。
      - 按第一次转向所在列/行、后续转向方向分段计数。
      - 起点和终点不算转向。
      - 避免把同一路径按不同转向点重复计。
      - 先固定转向顺序，再选每段长度。
  - id: M2.14
    name: 数字排列求和
    prereq: [M0.3]
    content:
      - 固定一个数字在某一数位，其余数字全排列。
      - 每位出现次数相同。
      - 总和=数字和×位权和×出现次数。
      - 不同五位整数由数字不重复排列得到。
      - 注意首位不能为 0（若包含 0）。
  - id: M2.15
    name: 多项式系数
    prereq: [M0.3, M0.4a]
    content:
      - (x_1+...+x_r)^n 中 x_1^{a_1}...x_r^{a_r} 的系数为 n!/(a_1!...a_r!)。
      - 条件 sum a_i=n。
      - 若某指数不满足和，系数为 0。
      - 多项式系数是二项式系数的推广。
      - 展开时先确定各变量指数。
  - id: M2.16
    name: 组合恒等式 hockey-stick
    prereq: [M0.4]
    content:
      - sum_{k=r}^m C(k,r)=C(m+1,r+1)。
      - 用于 sum_{k=4}^{10} C(k,4) 等。
      - 与二项式定理联用提取系数。
      - 注意求和下限和上限。
      - 可用组合数边界约定处理空和。
  - id: M2.17
    name: 无序可重复选择/多重集合
    prereq: [M2.1, M2.3]
    content:
      - 从 n 类中选 k 个可重复且无序：C(n+k-1,k)。
      - 非降序三元组 a≤b≤c 与从 6 个面中可重复选 3 个的多重集合一一对应。
      - 两个披萨允许相同且交换不区分时用 C(1024+1,2)。
      - 相同球分给两人用乘法再减全给一人。
      - 先判断“可重复”和“无序”两个条件。
      - 多重集合计数不要与 stars-bars 方程解混淆，但可互相转换。
  - id: M2.18
    name: 间隔法、禁选组合、座位计数
    prereq: [M0.3, M2.3]
    content:
      - 从 1..N 选 k 个无相邻：C(N-k+1,k)。
      - 至少隔 d 个空位：令 y_i=x_i-(d-1)(i-1)。
      - 12 人坐 40 座无相邻/至少两空座的条件计数。
      - 先排学生，再在间隙放空座；或先选座位再检查间隔。
      - 条件概率=满足两条件的位置数/满足条件的位置数。
      - 注意“至少两个空座”与“至少一个空座”的 d 不同。
  - id: M2.19
    name: 非均匀骰子、离散卷积与枚举
    prereq: [M2.12]
    content:
      - 每个面概率不同时用生成函数/多项式系数。
      - 六骰和=固定值求系数。
      - 差条件 (a-b)(b-c)=0 或 =2 枚举差值。
      - 公平骰总结果 6^n；非均匀骰每面权不同。
      - 连续同面补事件计数。
      - 枚举时先固定一个变量，再数另一个。
  # ================= M3 离散随机变量：期望、方差、变换 =================
  - id: M3.1
    name: 期望定义与线性性
    prereq: [M1.8]
    content:
      - E(X)=sum x p(x)。
      - E(aX+b)=aE(X)+b。
      - 表格分布求期望；先检查 PMF 和为 1。
      - 期望线性性：E(aX+bY)=aE(X)+bE(Y)。
      - 期望线性性不需要独立。
      - 对称分布可简化期望计算。
  - id: M3.1a
    name: 期望线性性无需独立
    prereq: [M3.1]
    content:
      - E(aX+bY)=aE(X)+bE(Y) 永远成立，不需要 X,Y 独立。
      - 只有 E(XY)=E(X)E(Y) 才需要独立（或至少不相关）。
      - 指示变量法求期望依赖线性性，不依赖指示变量独立。
      - 次序统计量求和、成本线性变换也依赖线性性。
      - 不要把“期望可加”和“方差可加”混淆。
  - id: M3.1b
    name: 非负整数随机变量的尾和公式
    prereq: [M3.1]
    content:
      - 若 X 取非负整数，E(X)=sum_{k=1}^∞ P(X≥k)。
      - 用于几何等待、次序统计量、指示变量计数。
      - 尾和公式需要非负整数取值。
      - 可简化期望计算，避免直接求和 x p(x)。
      - 与全期望公式可联用。
  - id: M3.2
    name: 随机变量函数的期望 LOTUS
    prereq: [M3.1]
    content:
      - E(g(X))=sum g(x)p(x)。
      - 分别算 E(X)、E(X^2)、E(4X^2-2X+3)。
      - 利用对称性简化 x=-1,0,1。
      - 不要先求 g(X) 的分布再求期望，除非必要。
      - 线性组合用期望线性性。
  - id: M3.3
    name: 方差、标准差与 E(X^2)-μ^2
    prereq: [M3.1, M3.2]
    content:
      - Var(X)=E[(X-μ)^2]=E(X^2)-μ^2。
      - 标准差 σ=sqrt(Var(X))。
      - 表格计算先算 E(X^2)。
      - Var(aX+b)=a^2 Var(X)。
      - 方差非负；计算后检查。
      - 标准差与原变量同单位。
  - id: M3.4
    name: 线性变换的期望与方差
    prereq: [M3.1, M3.3]
    content:
      - E(aX+b)=aE(X)+b。
      - Var(aX+b)=a^2 Var(X)。
      - sd(aX+b)=|a| sd(X)。
      - 成本 C=13000+2000X。
      - 线性变换不改变分布形状，只平移缩放。
      - 负斜率时标准差取绝对值。
  - id: M3.4a
    name: 线性变换的分布映射
    prereq: [M3.4]
    content:
      - 若 Y=aX+b，a≠0，则 p_Y(y)=p_X((y-b)/a)。
      - 取值集合是 X 的取值平移缩放。
      - E(Y)=aE(X)+b。
      - Var(Y)=a^2 Var(X)，sd(Y)=|a| sd(X)。
      - 用于成本、总价、单位换算等。
      - 注意 a<0 时取值顺序反转。
  - id: M3.5
    name: 概率区间与表格累加
    prereq: [M3.3, M1.8]
    content:
      - 先求 μ,σ。
      - 把 |X-μ|≤2σ 转成区间 [μ-2σ, μ+2σ]。
      - 累加对应 p(x)。
      - 注意端点是否包含。
      - 表格分布用离散取值，不要用连续正态近似。
      - 区间外的概率用 1 减。
  - id: M3.6
    name: 加权平均与 size-biased 抽样
    prereq: [M3.1]
    content:
      - 按班级频率求教授平均：sum n f_n。
      - 学生平均：sum n·(n f_n)/sum n f_n。
      - 大班学生被抽中的概率与其人数成比例。
      - 教授平均与学生平均抽样主体不同。
      - 两者都真实，不矛盾。
      - 加权平均权重必须和为 1。
  - id: M3.7
    name: 次序统计量：最大值 PMF
    prereq: [M2.1, M1.8]
    content:
      - 从 1..N 无放回选 n，最大值 Y=y。
      - 当且仅当选中 y，且其余 n-1 个从 1..y-1 选。
      - P(Y=y)=C(y-1,n-1)/C(N,n)，y=n,...,N。
      - 定义域下限是 n。
      - 检查 PMF 和为 1。
      - 最小值/中位数类似用组合数。
  - id: M3.8
    name: 次序统计量期望/方差与组合求和
    prereq: [M3.7, M0.4]
    content:
      - E(Y)=sum y C(y-1,n-1)/C(N,n)。
      - 用组合恒等式求和。
      - Var(Y)=E(Y^2)-[E(Y)]^2。
      - 可先算 E[Y(Y-1)] 简化。
      - 注意求和上下限。
      - 组合恒等式与二项式定理联用。
  - id: M3.9
    name: 矩母函数 MGF
    prereq: [M3.1, M0.6]
    content:
      - M_X(t)=E(e^{tX})。
      - 离散求和；求导得矩。
      - 收敛域由级数收敛决定。
      - 对数级数分布 MGF 为 ln(1-pe^t)/ln(1-p)，t<-ln p。
      - M_X'(0)=E(X)，M_X''(0)=E(X^2)。
      - 由 MGF 求均值方差。
  - id: M3.9a
    name: MGF 求矩公式与收敛域
    prereq: [M3.9]
    content:
      - M_X(t)=E(e^{tX})。
      - M_X'(0)=E(X)，M_X''(0)=E(X^2)。
      - Var(X)=M_X''(0)-[M_X'(0)]^2。
      - d/dt ln(1-pe^t)=-pe^t/(1-pe^t)。
      - 收敛域由 |pe^t|<1 得 t<-ln p。
      - 对数级数分布先用对数展开验证归一化，再求 MGF。
  - id: M3.10
    name: 指示变量与期望线性
    prereq: [M3.1, M1.8]
    content:
      - I_A 的期望 P(A)。
      - 把计数变量写成指示变量之和。
      - 秘书问题 X=sum I_i 得 E(X)=1。
      - 指示变量之间不一定独立，但期望可加。
      - 求方差时才需要考虑协方差/独立性。
      - 指示变量法适合“恰好/至少”计数。
  - id: M3.11
    name: 条件期望与全期望公式
    prereq: [M3.1, M1.3, M1.8]
    content:
      - 离散条件期望：E(X|Y=y)=sum_x x P(X=x|Y=y)。
      - 全期望公式：E(X)=E[E(X|Y)]=sum_y E(X|Y=y)P(Y=y)。
      - 后验预测：P(R_2|R_1)=E[P(R_2|X,R_1)|R_1]。
      - 条件期望是随机变量 E(X|Y)，再取期望得 E(X)。
      - 用于贝叶斯后验预测、加权平均、条件比较。
      - 全期望公式不需要独立。
  - id: M3.12
    name: 协方差与方差加法
    prereq: [M3.3]
    content:
      - Var(X+Y)=Var(X)+Var(Y)+2Cov(X,Y)。
      - Cov(X,Y)=E(XY)-E(X)E(Y)。
      - 独立 ⇒ 不相关 ⇒ 协方差为 0；反之不成立。
      - 指示变量和的方差需要协方差项。
      - 若指示变量独立则方差相加。
      - 用于理解“独立时方差可加”。
  # ================= M4 常见离散分布与性质 =================
  - id: M4.1
    name: Bernoulli 分布
    prereq: [M3.1]
    content:
      - P(X=1)=p，P(X=0)=1-p。
      - 期望 p，方差 p(1-p)。
      - 作为二项分布的基本单元。
      - 指示变量就是 Bernoulli 随机变量。
      - 用于诊断测试、单次试验。
  - id: M4.2
    name: 二项分布
    prereq: [M0.3, M3.1, M4.1]
    content:
      - X~B(n,p)，p(k)=C(n,k)p^k(1-p)^{n-k}。
      - 三球红白 X~B(3,p)。
      - 二项系数与期望恒等式。
      - PMF 归一化由二项式定理保证。
      - 独立重复试验中成功次数。
      - 尾概率用补事件或累加。
  - id: M4.2a
    name: 二项分布的期望与方差
    prereq: [M3.1, M3.3, M4.2]
    content:
      - X~B(n,p)：E(X)=np，Var(X)=np(1-p)。
      - 用指示变量 X=sum I_i 推导期望与方差。
      - 指示变量之间独立。
      - 二项 PMF 递推比：p(k+1)/p(k)=((n-k)/(k+1))·(p/(1-p))。
      - 递推比帮助枚举尾概率。
      - 不要把二项方差写成 np。
  - id: M4.3
    name: 二项尾概率与补事件
    prereq: [M4.2, M1.2]
    content:
      - P(X≥r)=1-P(X≤r-1)。
      - “10 次内至少两次 buzz”=1-P(0)-P(1)。
      - 尾概率逐项累加。
      - 注意“至少”“至多”“恰好”的边界。
      - 用递推比减少计算。
  - id: M4.4
    name: 几何分布与等待时间
    prereq: [M0.5, M1.6]
    content:
      - P(T=k)=(1-p)^{k-1}p，k=1,2,...。
      - 独立重复试验。
      - A/B 比谁先命中：sum P(T_A=k)P(T_B>k)。
      - 期望 1/p，方差 (1-p)/p^2。
      - 无记忆性。
      - 等待时间从 1 开始计数。
  - id: M4.4a
    name: 几何分布无记忆性与两个几何变量比较
    prereq: [M4.4, M1.10]
    content:
      - T~Geometric(p)：P(T=k)=(1-p)^{k-1}p。
      - E(T)=1/p，Var(T)=(1-p)/p^2。
      - 无记忆性：P(T>m+n|T>m)=P(T>n)。
      - 两个独立几何变量比较：P(T_A<T_B)=sum_{k≥1}P(T_A=k)P(T_B>k)。
      - P(T_B>k)=(1-p_B)^k。
      - 用有限/无限几何和求和。
  - id: M4.5
    name: 负二项分布/第 r 次成功位置
    prereq: [M4.2, M4.4]
    content:
      - 第 r 次成功恰在第 n 次：C(n-1,r-1)p^r(1-p)^{n-r}。
      - “第 10 块板第二次 buzz”前 9 次恰 1 次 buzz 且第 10 次 buzz。
      - 注意总试验次数定义与失败次数定义不同。
      - 期望若按总试验次数为 r/p。
      - 若按失败数为 r(1-p)/p。
      - 先明确变量含义再套公式。
  - id: M4.5a
    name: 负二项分布的定义区分
    prereq: [M4.5]
    content:
      - “第 r 次成功恰好发生在第 n 次试验”：前 n-1 次恰有 r-1 次成功，第 n 次成功。
      - PMF 为 C(n-1,r-1)p^r(1-p)^{n-r}。
      - 另一种定义是“失败次数”或“到第 r 次成功为止的失败数”，变量含义不同。
      - 期望按总试验次数为 r/p；按失败数为 r(1-p)/p。
      - 不能混用两种定义。
      - 写题时先标注 T=总试验次数还是 F=失败次数。
  - id: M4.6
    name: 泊松分布与稀有事件极限
    prereq: [M0.5, M4.2]
    content:
      - P(X=k)=e^{-λ}λ^k/k!。
      - 二项 n→∞，np→λ 的极限。
      - 秘书问题 X→Poisson(1)，均值 1。
      - 泊松参数 λ 既是均值也是方差。
      - sum λ^k/k!=e^λ。
      - 稀有事件计数近似。
  - id: M4.6a
    name: 泊松分布作为稀有事件计数极限
    prereq: [M4.6]
    content:
      - 泊松 PMF：P(X=k)=e^{-λ}λ^k/k!。
      - sum_{k=0}^∞ λ^k/k!=e^λ。
      - 泊松参数 λ 既是均值也是方差。
      - 二项极限：n→∞，p→0，np→λ 时 B(n,p)→Poisson(λ)。
      - 大量稀有、弱相关指示变量之和可趋于泊松；不要求严格二项。
      - 秘书问题中 X=sum I_i，E(X)=1，极限为 Poisson(1)，均值与极限均值一致。
  - id: M4.7
    name: 超几何/多元超几何
    prereq: [M2.9]
    content:
      - 无放回分类抽样。
      - 联合概率为各类组合数乘积除以总组合数。
      - 用于抽球奖金分布。
      - 与二项分布区别：无放回导致不独立。
      - 抽样数不能超过该类总数。
      - PMF 用组合数写。
  - id: M4.8
    name: 对数级数分布
    prereq: [M0.5, M3.9]
    content:
      - p(x)=-p^x/[x ln(1-p)]，x=1,2,...。
      - 用 -ln(1-p)=sum p^i/i 验证归一化。
      - MGF M_X(t)=ln(1-pe^t)/ln(1-p)，t<-ln p。
      - 由 MGF 求均值方差。
      - 求和时交换期望与求和，收敛条件 |pe^t|<1。
      - 均值方差由 M'(0),M''(0) 算，不要直接背复杂公式。
      - 推导路径：归一化→MGF→求导→代入 t=0。
  - id: M4.9
    name: 离散均匀/非均匀骰子模型
    prereq: [M1.9, M2.19]
    content:
      - 公平骰总结果 6^n。
      - 非均匀骰每面权不同。
      - 求和事件用生成函数/枚举。
      - 连续同面补事件计数。
      - a≤b≤c 计数用多重集合。
      - a<b<c 计数用组合数。
      - 差条件枚举差值。
  # ================= M5 条件、贝叶斯与条件计数专题 =================
  - id: M5.1
    name: 条件分布与后验分布
    prereq: [M1.5, M1.8]
    content:
      - 给定观测后更新随机变量分布。
      - 离散后验 P(X=i|E) ∝ P(E|X=i)P(X=i)。
      - 归一化常数是 P(E)。
      - 条件期望。
      - 后验分布用于预测下一次观测。
      - 先验×似然→后验。
  - id: M5.2
    name: 医学诊断：敏感度、特异度、贝叶斯
    prereq: [M1.4, M1.5]
    content:
      - 敏感度 P(+|D)，特异度 P(-|D^c)。
      - 假阳性 P(+|D^c)=1-特异度。
      - P(D|+)=P(+|D)P(D)/[P(+|D)P(D)+P(+|D^c)P(D^c)]。
      - 反解阈值参数。
      - 基础率谬误。
      - 先写四个条件概率再代入。
  - id: M5.2a
    name: 诊断 Bayes 的优势形式与基础率谬误
    prereq: [M5.2]
    content:
      - 后验优势 = 先验优势 × 似然比：
        P(D|+)/P(D^c|+) = [P(D)/P(D^c)]·[P(+|D)/P(+|D^c)]。
      - 敏感度 P(+|D)，特异度 P(-|D^c)，假阳性 P(+|D^c)=1-特异度。
      - 基础率很低时，即使测试准确率高，后验患病概率也可能不高。
      - 反解阈值参数时，把 P(D|+) 写成 θ 的分式方程。
      - 优势形式可减少重复计算。
  - id: M5.3
    name: 条件计数概率（座位问题）
    prereq: [M2.18, M1.3]
    content:
      - 条件概率=满足两条件的位置数/满足条件的位置数。
      - 若 instructor 条件蕴含 TA 条件，则 P(I|TA)=N_I/N_TA。
      - 先数条件事件，再数交事件。
      - 间隔法计数。
      - 注意“至少两个空座”与“无相邻”的包含关系。
      - 条件概率分母不为 0。
  - id: M5.4
    name: 网络可靠性条件概率
    prereq: [M1.3, M1.6, M1.2]
    content:
      - 路径事件为桥事件的并：直接桥、上路径、下路径。
      - 独立桥开概率相乘。
      - 求 P(3开|E-W连通)=P(3开∩连通)/P(连通)。
      - 用并交补事件化简。
      - 先列所有连通路径。
      - 桥独立时联合概率可乘。
  - id: M5.5
    name: 模式竞争、首步分析与吸收马尔可夫链
    prereq: [M1.6, M0.8, M4.4]
    content:
      - 竞争模式 HHH 与 HTH。
      - 按已匹配前缀设状态，列首步方程。
      - 吸收概率。
      - 处理模式重叠。
      - 不能只用首次出现概率简单比较。
      - 状态要包含“已匹配到哪一步”。
  - id: M5.5a
    name: 吸收概率方程的状态与边界条件
    prereq: [M5.5, M0.8]
    content:
      - 按“已经匹配到目标模式的前缀”定义状态。
      - HHH 与 HTH 竞争中状态可为：空、H、HH、HTH 已出现、HHH 已出现。
      - 设 h_s 为从状态 s 出发 HHH 先出现的概率。
      - 首步方程：h_s=p h_{sH}+(1-p)h_{sT}。
      - 边界条件：h_HHH=1，h_HTH=0。
      - 解线性方程组。
      - 不能只用“首次出现概率”简单比较，因为模式有重叠。
  - id: M5.6
    name: 后验预测与条件期望
    prereq: [M5.1, M4.2, M3.11]
    content:
      - 给定第一次抽到红球，更新 urn 中红球数分布。
      - 下一次抽红概率 E[X/3|R_1]。
      - 三球红白问题得 p。
      - 后验预测=条件期望。
      - 先求后验分布再加权。
      - 全期望公式可验证结果。
  # ================= M6 随机过程与长期频率 =================
  - id: M6.1
    name: 两状态马尔可夫链
    prereq: [M0.8, M1.3]
    content:
      - 状态 W/L，转移矩阵 [[0.6,0.4],[0.3,0.7]]。
      - 下一状态只依赖当前状态。
      - 行和为 1。
      - 初始分布。
      - 转移概率 P(X_{n+1}=j|X_n=i)。
      - 多步转移用矩阵乘法。
  - id: M6.2
    name: 平稳分布与长期频率
    prereq: [M6.1]
    content:
      - 解 πP=π，π_W+π_L=1。
      - 长期赢的频率。
      - 与初始分布无关。
      - 平稳分布各分量非负。
      - 长期频率等于平稳概率。
      - 解线性方程组。
  - id: M6.3
    name: 独立重复试验、补事件与等待时间
    prereq: [M4.4, M1.2]
    content:
      - 无相邻同面序列计数 6·5^{n-1}。
      - p_n=1-(5/6)^{n-1} 解最小 n。
      - 几何等待比较。
      - 补事件用于“至少一次/至少两次”。
      - 独立试验概率相乘。
      - 对数不等式解 n。
  # ================= M7 应用模型与综合题 =================
  - id: M7.1
    name: 专利寿命与成本线性变换
    prereq: [M3.1, M3.3, M3.4, M3.5]
    content:
      - 表格求 μ,σ。
      - 成本 C=13000+2000X。
      - E(C)=13000+2000E(X)。
      - sd(C)=2000 sd(X)。
      - 区间概率累加。
      - 先算 X 的期望方差，再线性变换。
      - 成本标准差单位与成本相同。
  - id: M7.2
    name: 抽球奖金 PMF/CDF
    prereq: [M2.9, M1.8, M1.8a, M4.7]
    content:
      - 两球无放回，按白/黑/橙组合定 X 取值。
      - 有利组合数/总 C(12,2)。
      - 列 PMF。
      - CDF 为按 x 累加并写成阶梯。
      - 不同组合映射到同一 X 值要合并。
      - 检查 PMF 和为 1。
  - id: M7.3
    name: 班级大小：教授平均 vs 学生平均
    prereq: [M3.6]
    content:
      - 教授平均 sum n f_n=25。
      - 学生平均 sum n(nf_n)/sum nf_n=53.2。
      - 两者都真实，抽样主体不同。
      - 大班学生被抽中的概率与其人数成比例。
      - 加权平均权重和为 1。
      - 解释“平均学生面临的班级规模”是 size-biased。
  - id: M7.4
    name: 最大球号次序统计
    prereq: [M3.7, M3.8]
    content:
      - 最大号 PMF：P(Y=y)=C(y-1,n-1)/C(N,n)。
      - 期望、方差公式。
      - 组合求和恒等式。
      - 定义域 y=n,...,N。
      - 检查 PMF 和为 1。
      - 方差用 E(Y^2)-[E(Y)]^2。
  - id: M7.5
    name: 秘书信件问题
    prereq: [M2.11, M3.10, M4.6]
    content:
      - 恰好 k 封正确：P(X=k)=C(n,k)D_{n-k}/n!。
      - 指示变量得 E(X)=1。
      - n→∞ 为 Poisson(1)。
      - 错排数 D_n。
      - 极限均值与 E(X)=1 一致。
      - 区分恰好 k 与至少 k。
  - id: M7.6
    name: 三球红白：先验二项+抽球后验
    prereq: [M4.2, M5.1, M5.6]
    content:
      - X~B(3,p)。
      - 给定抽到红球后 P(X=i|R) ∝ P(R|X=i)P(X=i)。
      - 下一次抽红概率为后验预测 p。
      - 先算后验分布再求条件期望。
      - 归一化常数。
      - 用全期望公式验证。
  - id: M7.7
    name: 二项分布倒数期望恒等式
    prereq: [M4.2, M0.4, M0.4a, M3.2]
    content:
      - E[1/(X+1)]=sum C(n,k)p^k q^{n-k}/(k+1)。
      - 用 C(n,k)/(k+1)=C(n+1,k+1)/(n+1)。
      - 二项和得 (1-q^{n+1})/[(n+1)p]。
      - q=1-p。
      - 先换组合恒等式再套二项式定理。
      - 注意 k 从 0 到 n。
  - id: M7.8
    name: 电路板测试：全概率+贝叶斯+负二项
    prereq: [M1.4, M1.5, M4.5, M4.5a, M4.3]
    content:
      - q=P(B)=θ(0.1)+(1-θ)(0.9)。
      - 第 10 块第二次 buzz 用负二项。
      - 10 块内至少两次用二项补。
      - P(D|B) 贝叶斯。
      - 反解 θ=81/82。
      - 先明确 B/B' 与 D/D' 的条件概率。
      - 条件补事件 P(B|D')=1-θ。
  - id: M7.9
    name: 桥网络条件概率
    prereq: [M5.4]
    content:
      - 桥 3 开、上路径 1&4、下路径 2&5。
      - 独立概率乘积。
      - 条件概率比值。
      - 先列连通事件。
      - 用补事件简化。
      - 分母 P(连通) 要包含所有路径。
  - id: M7.10
    name: 取球生成函数
    prereq: [M2.12, M2.12a]
    content:
      - 红 1+x；蓝 1+x+x^2。
      - 绿偶 1/(1-x^2)。
      - 橙正奇 x/(1-x^2)。
      - 紫 3 倍 1/(1-x^3)。
      - 求 x^9 系数。
      - 先写总生成函数再展开。
      - 注意“至少一个”和“正”的区别。
  - id: M7.11
    name: 事件概率上界与参数优化
    prereq: [M1.2, M1.2a, M0.7, M1.6]
    content:
      - 由 P(A∪B∪C)≤1 建立 α,β 约束。
      - pairwise 交概率。
      - P(A∩B)≤min(P(A),P(B))。
      - 把并概率写成包含排除。
      - 在可行域顶点取最大 β。
      - 线性不等式/可行域语言。
      - 检查非负约束。
  - id: M7.12
    name: 夫妻不相邻容斥
    prereq: [M2.10, M1.2, M0.3]
    content:
      - 4 对夫妻排一行。
      - 设 E_i=第 i 对相邻。
      - P(∩E_i^c)=1-sum P(E_i)+sum P(E_iE_j)-...
      - 相邻夫妻捆绑计数。
      - 注意夫妻内部顺序 2!。
      - 容斥符号交替。
      - 先算总排列 8!。

