  # ================= M7 应用模型与综合题 =================
  - id: M7.1
    name: 专利寿命与成本线性变换
    prereq: [M3.1, M3.3, M3.4, M3.5]
    content:
      - 表格求 μ,σ。
      - 成本 C=13000+2000X。
      - E(C)=13000+2000E(X)。
      - sd(C)=2000 sd(X)。
      - 区间概率累加。
      - 先算 X 的期望方差，再线性变换。
      - 成本标准差单位与成本相同。
  - id: M7.2
    name: 抽球奖金 PMF/CDF
    prereq: [M2.9, M1.8, M1.8a, M4.7]
    content:
      - 两球无放回，按白/黑/橙组合定 X 取值。
      - 有利组合数/总 C(12,2)。
      - 列 PMF。
      - CDF 为按 x 累加并写成阶梯。
      - 不同组合映射到同一 X 值要合并。
      - 检查 PMF 和为 1。
  - id: M7.3
    name: 班级大小：教授平均 vs 学生平均
    prereq: [M3.6]
    content:
      - 教授平均 sum n f_n=25。
      - 学生平均 sum n(nf_n)/sum nf_n=53.2。
      - 两者都真实，抽样主体不同。
      - 大班学生被抽中的概率与其人数成比例。
      - 加权平均权重和为 1。
      - 解释“平均学生面临的班级规模”是 size-biased。
  - id: M7.4
    name: 最大球号次序统计
    prereq: [M3.7, M3.8]
    content:
      - 最大号 PMF：P(Y=y)=C(y-1,n-1)/C(N,n)。
      - 期望、方差公式。
      - 组合求和恒等式。
      - 定义域 y=n,...,N。
      - 检查 PMF 和为 1。
      - 方差用 E(Y^2)-[E(Y)]^2。
  - id: M7.5
    name: 秘书信件问题
    prereq: [M2.11, M3.10, M4.6]
    content:
      - 恰好 k 封正确：P(X=k)=C(n,k)D_{n-k}/n!。
      - 指示变量得 E(X)=1。
      - n→∞ 为 Poisson(1)。
      - 错排数 D_n。
      - 极限均值与 E(X)=1 一致。
      - 区分恰好 k 与至少 k。
  - id: M7.6
    name: 三球红白：先验二项+抽球后验
    prereq: [M4.2, M5.1, M5.6]
    content:
      - X~B(3,p)。
      - 给定抽到红球后 P(X=i|R) ∝ P(R|X=i)P(X=i)。
      - 下一次抽红概率为后验预测 p。
      - 先算后验分布再求条件期望。
      - 归一化常数。
      - 用全期望公式验证。
  - id: M7.7
    name: 二项分布倒数期望恒等式
    prereq: [M4.2, M0.4, M0.4a, M3.2]
    content:
      - E[1/(X+1)]=sum C(n,k)p^k q^{n-k}/(k+1)。
      - 用 C(n,k)/(k+1)=C(n+1,k+1)/(n+1)。
      - 二项和得 (1-q^{n+1})/[(n+1)p]。
      - q=1-p。
      - 先换组合恒等式再套二项式定理。
      - 注意 k 从 0 到 n。
  - id: M7.8
    name: 电路板测试：全概率+贝叶斯+负二项
    prereq: [M1.4, M1.5, M4.5, M4.5a, M4.3]
    content:
      - q=P(B)=θ(0.1)+(1-θ)(0.9)。
      - 第 10 块第二次 buzz 用负二项。
      - 10 块内至少两次用二项补。
      - P(D|B) 贝叶斯。
      - 反解 θ=81/82。
      - 先明确 B/B' 与 D/D' 的条件概率。
      - 条件补事件 P(B|D')=1-θ。
  - id: M7.9
    name: 桥网络条件概率
    prereq: [M5.4]
    content:
      - 桥 3 开、上路径 1&4、下路径 2&5。
      - 独立概率乘积。
      - 条件概率比值。
      - 先列连通事件。
      - 用补事件简化。
      - 分母 P(连通) 要包含所有路径。
  - id: M7.10
    name: 取球生成函数
    prereq: [M2.12, M2.12a]
    content:
      - 红 1+x；蓝 1+x+x^2。
      - 绿偶 1/(1-x^2)。
      - 橙正奇 x/(1-x^2)。
      - 紫 3 倍 1/(1-x^3)。
      - 求 x^9 系数。
      - 先写总生成函数再展开。
      - 注意“至少一个”和“正”的区别。
  - id: M7.11
    name: 事件概率上界与参数优化
    prereq: [M1.2, M1.2a, M0.7, M1.6]
    content:
      - 由 P(A∪B∪C)≤1 建立 α,β 约束。
      - pairwise 交概率。
      - P(A∩B)≤min(P(A),P(B))。
      - 把并概率写成包含排除。
      - 在可行域顶点取最大 β。
      - 线性不等式/可行域语言。
      - 检查非负约束。
  - id: M7.12
    name: 夫妻不相邻容斥
    prereq: [M2.10, M1.2, M0.3]
    content:
      - 4 对夫妻排一行。
      - 设 E_i=第 i 对相邻。
      - P(∩E_i^c)=1-sum P(E_i)+sum P(E_iE_j)-...
      - 相邻夫妻捆绑计数。
      - 注意夫妻内部顺序 2!。
      - 容斥符号交替。
      - 先算总排列 8!。
