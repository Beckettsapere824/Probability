  # ================= M4 常见离散分布与性质 =================
  - id: M4.1
    name: Bernoulli 分布
    prereq: [M3.1]
    content:
      - P(X=1)=p，P(X=0)=1-p。
      - 期望 p，方差 p(1-p)。
      - 作为二项分布的基本单元。
      - 指示变量就是 Bernoulli 随机变量。
      - 用于诊断测试、单次试验。
  - id: M4.2
    name: 二项分布
    prereq: [M0.3, M3.1, M4.1]
    content:
      - X~B(n,p)，p(k)=C(n,k)p^k(1-p)^{n-k}。
      - 三球红白 X~B(3,p)。
      - 二项系数与期望恒等式。
      - PMF 归一化由二项式定理保证。
      - 独立重复试验中成功次数。
      - 尾概率用补事件或累加。
  - id: M4.2a
    name: 二项分布的期望与方差
    prereq: [M3.1, M3.3, M4.2]
    content:
      - X~B(n,p)：E(X)=np，Var(X)=np(1-p)。
      - 用指示变量 X=sum I_i 推导期望与方差。
      - 指示变量之间独立。
      - 二项 PMF 递推比：p(k+1)/p(k)=((n-k)/(k+1))·(p/(1-p))。
      - 递推比帮助枚举尾概率。
      - 不要把二项方差写成 np。
  - id: M4.3
    name: 二项尾概率与补事件
    prereq: [M4.2, M1.2]
    content:
      - P(X≥r)=1-P(X≤r-1)。
      - “10 次内至少两次 buzz”=1-P(0)-P(1)。
      - 尾概率逐项累加。
      - 注意“至少”“至多”“恰好”的边界。
      - 用递推比减少计算。
  - id: M4.4
    name: 几何分布与等待时间
    prereq: [M0.5, M1.6]
    content:
      - P(T=k)=(1-p)^{k-1}p，k=1,2,...。
      - 独立重复试验。
      - A/B 比谁先命中：sum P(T_A=k)P(T_B>k)。
      - 期望 1/p，方差 (1-p)/p^2。
      - 无记忆性。
      - 等待时间从 1 开始计数。
  - id: M4.4a
    name: 几何分布无记忆性与两个几何变量比较
    prereq: [M4.4, M1.10]
    content:
      - T~Geometric(p)：P(T=k)=(1-p)^{k-1}p。
      - E(T)=1/p，Var(T)=(1-p)/p^2。
      - 无记忆性：P(T>m+n|T>m)=P(T>n)。
      - 两个独立几何变量比较：P(T_A<T_B)=sum_{k≥1}P(T_A=k)P(T_B>k)。
      - P(T_B>k)=(1-p_B)^k。
      - 用有限/无限几何和求和。
  - id: M4.5
    name: 负二项分布/第 r 次成功位置
    prereq: [M4.2, M4.4]
    content:
      - 第 r 次成功恰在第 n 次：C(n-1,r-1)p^r(1-p)^{n-r}。
      - “第 10 块板第二次 buzz”前 9 次恰 1 次 buzz 且第 10 次 buzz。
      - 注意总试验次数定义与失败次数定义不同。
      - 期望若按总试验次数为 r/p。
      - 若按失败数为 r(1-p)/p。
      - 先明确变量含义再套公式。
  - id: M4.5a
    name: 负二项分布的定义区分
    prereq: [M4.5]
    content:
      - “第 r 次成功恰好发生在第 n 次试验”：前 n-1 次恰有 r-1 次成功，第 n 次成功。
      - PMF 为 C(n-1,r-1)p^r(1-p)^{n-r}。
      - 另一种定义是“失败次数”或“到第 r 次成功为止的失败数”，变量含义不同。
      - 期望按总试验次数为 r/p；按失败数为 r(1-p)/p。
      - 不能混用两种定义。
      - 写题时先标注 T=总试验次数还是 F=失败次数。
  - id: M4.6
    name: 泊松分布与稀有事件极限
    prereq: [M0.5, M4.2]
    content:
      - P(X=k)=e^{-λ}λ^k/k!。
      - 二项 n→∞，np→λ 的极限。
      - 秘书问题 X→Poisson(1)，均值 1。
      - 泊松参数 λ 既是均值也是方差。
      - sum λ^k/k!=e^λ。
      - 稀有事件计数近似。
  - id: M4.6a
    name: 泊松分布作为稀有事件计数极限
    prereq: [M4.6]
    content:
      - 泊松 PMF：P(X=k)=e^{-λ}λ^k/k!。
      - sum_{k=0}^∞ λ^k/k!=e^λ。
      - 泊松参数 λ 既是均值也是方差。
      - 二项极限：n→∞，p→0，np→λ 时 B(n,p)→Poisson(λ)。
      - 大量稀有、弱相关指示变量之和可趋于泊松；不要求严格二项。
      - 秘书问题中 X=sum I_i，E(X)=1，极限为 Poisson(1)，均值与极限均值一致。
  - id: M4.7
    name: 超几何/多元超几何
    prereq: [M2.9]
    content:
      - 无放回分类抽样。
      - 联合概率为各类组合数乘积除以总组合数。
      - 用于抽球奖金分布。
      - 与二项分布区别：无放回导致不独立。
      - 抽样数不能超过该类总数。
      - PMF 用组合数写。
  - id: M4.8
    name: 对数级数分布
    prereq: [M0.5, M3.9]
    content:
      - p(x)=-p^x/[x ln(1-p)]，x=1,2,...。
      - 用 -ln(1-p)=sum p^i/i 验证归一化。
      - MGF M_X(t)=ln(1-pe^t)/ln(1-p)，t<-ln p。
      - 由 MGF 求均值方差。
      - 求和时交换期望与求和，收敛条件 |pe^t|<1。
      - 均值方差由 M'(0),M''(0) 算，不要直接背复杂公式。
      - 推导路径：归一化→MGF→求导→代入 t=0。
  - id: M4.9
    name: 离散均匀/非均匀骰子模型
    prereq: [M1.9, M2.19]
    content:
      - 公平骰总结果 6^n。
      - 非均匀骰每面权不同。
      - 求和事件用生成函数/枚举。
      - 连续同面补事件计数。
      - a≤b≤c 计数用多重集合。
      - a<b<c 计数用组合数。
      - 差条件枚举差值。
