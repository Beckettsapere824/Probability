  # ================= M6 随机过程与长期频率 =================
  - id: M6.1
    name: 两状态马尔可夫链
    prereq: [M0.8, M1.3]
    content:
      - 状态 W/L，转移矩阵 [[0.6,0.4],[0.3,0.7]]。
      - 下一状态只依赖当前状态。
      - 行和为 1。
      - 初始分布。
      - 转移概率 P(X_{n+1}=j|X_n=i)。
      - 多步转移用矩阵乘法。
  - id: M6.2
    name: 平稳分布与长期频率
    prereq: [M6.1]
    content:
      - 解 πP=π，π_W+π_L=1。
      - 长期赢的频率。
      - 与初始分布无关。
      - 平稳分布各分量非负。
      - 长期频率等于平稳概率。
      - 解线性方程组。
  - id: M6.3
    name: 独立重复试验、补事件与等待时间
    prereq: [M4.4, M1.2]
    content:
      - 无相邻同面序列计数 6·5^{n-1}。
      - p_n=1-(5/6)^{n-1} 解最小 n。
      - 几何等待比较。
      - 补事件用于“至少一次/至少两次”。
      - 独立试验概率相乘。
      - 对数不等式解 n。
