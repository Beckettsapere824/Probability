  # ================= M2 组合计数与抽样模型 =================
  - id: M2.1
    name: 有序/无序、有放回/无放回
    prereq: [M0.3, M1.9]
    content:
      - 有序有放回：n^k。
      - 有序无放回：P(n,k)。
      - 无序无放回：C(n,k)。
      - 无序有放回：C(n+k-1,k)。
      - 先判断四格模型，再计数。
      - 抽样后是否放回影响分母和后续概率。
  - id: M2.2
    name: 子集选择与二进制选择
    prereq: [M0.3]
    content:
      - 每个元素选/不选，k 个可选对象有 2^k 种子集。
      - 配料组合：每种配料选或不选。
      - 允许空集和全集。
      - 两个对象可相同且无序时用多重集合计数，不是简单 2^k 平方。
  - id: M2.3
    name: stars-bars：非负整数解
    prereq: [M0.3]
    content:
      - x_1+...+x_r=n，x_i≥0 的解数 C(n+r-1,r-1)。
      - 方程解、不等式加松弛变量。
      - 变量可为零；若要求正数先换元。
      - 求和范围要按变量个数确定。
      - 与组合数边界约定联用。
  - id: M2.3a
    name: 整数解题的条件甄别
    prereq: [M2.3, M2.4, M2.5]
    content:
      - 先确认变量是“非负整数”“正整数”“整数”还是“有上下界整数”。
      - 非负解：C(n+r-1,r-1)；正整数解：令 y_i=x_i-1 后转非负。
      - 不等式 x+y+z<25 转 x+y+z≤24，再加松弛变量转等式。
      - 若和固定且上界大于和，则上界可能自动满足，不需要容斥；若上界小于和才需要容斥。
      - 题干写“integer solutions”但未写非负时，不能默认非负。
      - 答案与常规计数不符时，先回查是否漏了“非负/正/上界/不等式”条件。
  - id: M2.4
    name: 正整数解与不等式松弛
    prereq: [M2.3]
    content:
      - x_i≥1：令 y_i=x_i-1，转 y_i≥0。
      - x+y+z<25 转 x+y+z≤24，再加松弛变量 s≥0。
      - 正整数解数 C(n-1,r-1)。
      - 不等式解数等于加松弛后的等式解数。
      - 求和恒等式可化简多组解数相加。
  - id: M2.5
    name: 上界约束与容斥
    prereq: [M2.3, M1.2]
    content:
      - 先算无约束解，再减去 x_i≥a_i 的越界事件，加回交集。
      - x_i≤b_i 的容斥：总数 - sum 越界 + sum 两两越界 - ...
      - 越界换元：x_i'=x_i-(b_i+1)≥0。
      - 检查上界是否自动满足。
      - 多变量上界约束逐项容斥。
  - id: M2.6
    name: 容斥原理、非空盒子、满射计数
    prereq: [M1.2, M0.3]
    content:
      - 至少一个/恰好非空。
      - r 个盒全非空：sum_{j=0}^r (-1)^j C(r,j)(r-j)^n。
      - 同色球按颜色独立分配，再对盒非空容斥。
      - 不同颜色之间分配独立相乘。
      - 满射计数等价于全非空盒子分配。
  - id: M2.6a
    name: “恰好/至少/非空”的容斥转换
    prereq: [M2.6]
    content:
      - “恰好 k 个盒子非空”“至少一个盒子非空”“所有盒子非空”是不同事件。
      - 全非空：总数减去至少一个空盒，再容斥加回至少两个空盒……
      - 同色球不可区分时，先按颜色分别用 stars-bars 分配，再对盒子非空做容斥。
      - 不同颜色之间独立相乘。
      - “至少一人有球”=总数−全给同一人。
      - 写容斥时先定义坏事件 E_i=第 i 个盒子为空。
  - id: M2.7
    name: 随机排列与相对顺序
    prereq: [M0.3]
    content:
      - 随机排列中指定元素的相对次序等可能。
      - 固定指定 r 个元素的相对次序，其他元素任意。
      - 总排列数 n!，指定相对次序占 1/r!。
      - A 在 C 前且 C 在 E 前概率为 1/3!。
      - 忽略无关元素的相对顺序。
      - “before”不要求相邻。
  - id: M2.8
    name: 生日问题/占位模型
    prereq: [M1.9, M2.1]
    content:
      - n 个球入 m 盒总 m^n。
      - 无重复/无空盒用补事件或容斥。
      - 至少一盒多球：1 - 全不同概率。
      - 占位模型要求球可区分、盒可区分；否则换模型。
      - 生日问题中“重复”=至少两个同盒。
  - id: M2.9
    name: 分类无放回抽样与多元超几何
    prereq: [M0.3, M1.9]
    content:
      - 从白/黑/橙分类中抽两球，有利数=各类选数乘积。
      - 总样本数=C(总球数,抽样数)。
      - 无放回联合概率用组合数。
      - PMF 必须归一化。
      - 不同类别组合可能映射到同一个随机变量值，要合并。
  - id: M2.10
    name: 配对、夫妻、袜子鞋子计数
    prereq: [M2.9]
    content:
      - 先选完整配对，再从剩余配对中各选一只。
      - 区分“同色同款不可区分”和“左右鞋可区分/配对结构”。
      - 袜子题：同色同款不可区分；鞋子题：左右可区分但配对结构相同。
      - 夫妻选人恰一对：先选夫妻对，再从其他夫妻中各选一人且不能形成新夫妻对。
      - 注意“恰好一对”与“至少一对”区别。
  - id: M2.11
    name: 错排与恰好 k 个正确
    prereq: [M0.3, M1.9]
    content:
      - 错排 D_n=n! sum_{j=0}^n (-1)^j/j!。
      - 递推 D_n=(n-1)(D_{n-1}+D_{n-2})。
      - 恰好 k 个正确：选正确对象 C(n,k)，其余错排 D_{n-k}。
      - 至少 k 个正确用并/容斥。
      - D_n/n! → e^{-1}。
      - 错排数不要与全排列混淆。
  - id: M2.12
    name: 普通生成函数计数
    prereq: [M0.5, M2.1]
    content:
      - 每类约束对应因子。
      - 0/1 用 1+x。
      - 0..m 用 1+x+...+x^m。
      - 偶数用 1/(1-x^2)。
      - 正奇数用 x/(1-x^2)。
      - 3 的倍数用 1/(1-x^3)。
      - 总生成函数为各因子乘积，求 x^n 系数。
      - 系数可用二项式定理、几何级数、枚举展开。
  - id: M2.12a
    name: 生成函数因子的“至少/正/非负”区别
    prereq: [M2.12]
    content:
      - 非负偶数：1+x^2+x^4+...=1/(1-x^2)。
      - 正奇数：x+x^3+x^5+...=x/(1-x^2)。
      - 非负 3 的倍数：1+x^3+x^6+...=1/(1-x^3)。
      - 正 3 的倍数：x^3/(1-x^3)。
      - “至少一个”可通过把非负因子减去 1，或直接用正因子。
      - 多类独立选择：总生成函数为各因子乘积。
      - 取球题中“橙球必须取奇数个且至少一个”因子是 x/(1-x^2)，不是 1/(1-x^2)。
  - id: M2.13
    name: 网格路径与转向分段
    prereq: [M0.3]
    content:
      - 东北路径数 C(m+n,n)。
      - 恰三次转向=把路径分成 4 段。
      - 按第一次转向所在列/行、后续转向方向分段计数。
      - 起点和终点不算转向。
      - 避免把同一路径按不同转向点重复计。
      - 先固定转向顺序，再选每段长度。
  - id: M2.14
    name: 数字排列求和
    prereq: [M0.3]
    content:
      - 固定一个数字在某一数位，其余数字全排列。
      - 每位出现次数相同。
      - 总和=数字和×位权和×出现次数。
      - 不同五位整数由数字不重复排列得到。
      - 注意首位不能为 0（若包含 0）。
  - id: M2.15
    name: 多项式系数
    prereq: [M0.3, M0.4a]
    content:
      - (x_1+...+x_r)^n 中 x_1^{a_1}...x_r^{a_r} 的系数为 n!/(a_1!...a_r!)。
      - 条件 sum a_i=n。
      - 若某指数不满足和，系数为 0。
      - 多项式系数是二项式系数的推广。
      - 展开时先确定各变量指数。
  - id: M2.16
    name: 组合恒等式 hockey-stick
    prereq: [M0.4]
    content:
      - sum_{k=r}^m C(k,r)=C(m+1,r+1)。
      - 用于 sum_{k=4}^{10} C(k,4) 等。
      - 与二项式定理联用提取系数。
      - 注意求和下限和上限。
      - 可用组合数边界约定处理空和。
  - id: M2.17
    name: 无序可重复选择/多重集合
    prereq: [M2.1, M2.3]
    content:
      - 从 n 类中选 k 个可重复且无序：C(n+k-1,k)。
      - 非降序三元组 a≤b≤c 与从 6 个面中可重复选 3 个的多重集合一一对应。
      - 两个披萨允许相同且交换不区分时用 C(1024+1,2)。
      - 相同球分给两人用乘法再减全给一人。
      - 先判断“可重复”和“无序”两个条件。
      - 多重集合计数不要与 stars-bars 方程解混淆，但可互相转换。
  - id: M2.18
    name: 间隔法、禁选组合、座位计数
    prereq: [M0.3, M2.3]
    content:
      - 从 1..N 选 k 个无相邻：C(N-k+1,k)。
      - 至少隔 d 个空位：令 y_i=x_i-(d-1)(i-1)。
      - 12 人坐 40 座无相邻/至少两空座的条件计数。
      - 先排学生，再在间隙放空座；或先选座位再检查间隔。
      - 条件概率=满足两条件的位置数/满足条件的位置数。
      - 注意“至少两个空座”与“至少一个空座”的 d 不同。
  - id: M2.19
    name: 非均匀骰子、离散卷积与枚举
    prereq: [M2.12]
    content:
      - 每个面概率不同时用生成函数/多项式系数。
      - 六骰和=固定值求系数。
      - 差条件 (a-b)(b-c)=0 或 =2 枚举差值。
      - 公平骰总结果 6^n；非均匀骰每面权不同。
      - 连续同面补事件计数。
      - 枚举时先固定一个变量，再数另一个。
