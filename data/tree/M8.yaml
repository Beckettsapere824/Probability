  - id: M8.9
    name: Survival and hazard / 生存函数与风险率
    module: M8
    prereq: [M8.1, M8.4]
    status: teaching
    source: SDST2601A Ch6 §6.1 Def 6.1
    思路:
      读者起点: "会 F 与指数无记忆性；未必区分『已失效』与『仍存活』。"
      核心问题: "如何描述活到 t 的概率，以及活到 t 后瞬时失效的强度？"
      叙事路径:
        - "S(t)=1-F(t)。"
        - "λ(t)=f(t)/S(t) 条件失效强度。"
        - "由 λ 重建 F：F=1-exp(-∫λ)。"
        - "指数 = 常数风险；递增风险更贴近老化。"
      必须建立的直觉:
        - "S 看存活；λ 看『这个年纪有多容易坏』。"
        - "常数 λ ↔ 无记忆。"
      易错点: "把 f 叫做 failure rate；对非指数套无记忆。"
      出口衔接: "变换分布、Weibull 等由 hazard 构造。"
      成功标准: "能由 F 写 S 与 λ；能解释指数的常数风险。"
    content:
      - "S=1-F; λ=f/S"
      - "F=1-exp(-∫λ)"
