  # ================= M5 条件、贝叶斯与条件计数专题 =================
  - id: M5.1
    name: 条件分布与后验分布
    prereq: [M1.3, M1.8, M1.10]
    content:
      - 条件 PMF：P(X=x|Y=y)=P(X=x,Y=y)/P(Y=y)。
      - 后验分布由贝叶斯公式得到。
      - 条件分布仍是合法分布。
      - 与无条件分布一般不同。
      - 用于更新信念。
  - id: M5.2
    name: 医学诊断：敏感度、特异度、贝叶斯
    prereq: [M1.5, M1.4]
    content:
      - 敏感度 P(+|D)、特异度 P(-|D^c)。
      - 后验 P(D|+)=P(+|D)P(D)/P(+)。
      - 基础率谬误。
  - id: M5.2a
    name: 诊断 Bayes 的优势形式与基础率谬误
    prereq: [M5.2]
    content:
      - 优势比形式。
      - 基础率很低时后验仍可能不高。
  - id: M5.3
    name: 条件计数概率（座位问题）
    prereq: [M2.1, M1.3]
    content:
      - 给定部分座位信息下的条件概率。
  - id: M5.4
    name: 网络可靠性条件概率
    prereq: [M1.3, M1.4]
    content:
      - 系统连通在部分边失效下的条件概率。
  - id: M5.5
    name: 模式竞争、首步分析与吸收马尔可夫链
    prereq: [M6.1, M1.4]
    content:
      - 首步分析、吸收概率。
  - id: M5.5a
    name: 吸收概率方程的状态与边界条件
    prereq: [M5.5]
    content:
      - 边界条件与线性方程组。
  - id: M5.6
    name: 后验预测与条件期望
    prereq: [M5.1, M3.11]
    content:
      - 后验预测分布；条件期望。
