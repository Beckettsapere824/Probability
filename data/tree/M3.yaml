  # ================= M3 离散随机变量：期望、方差、变换 =================
  - id: M3.1
    name: 期望定义与线性性
    prereq: [M1.8]
    content:
      - E(X)=sum x p(x)。
      - E(aX+b)=aE(X)+b。
      - 表格分布求期望；先检查 PMF 和为 1。
      - 期望线性性：E(aX+bY)=aE(X)+bE(Y)。
      - 期望线性性不需要独立。
      - 对称分布可简化期望计算。
  - id: M3.1a
    name: 期望线性性无需独立
    prereq: [M3.1]
    content:
      - E(aX+bY)=aE(X)+bE(Y) 永远成立，不需要 X,Y 独立。
      - 只有 E(XY)=E(X)E(Y) 才需要独立（或至少不相关）。
      - 指示变量法求期望依赖线性性，不依赖指示变量独立。
      - 次序统计量求和、成本线性变换也依赖线性性。
      - 不要把“期望可加”和“方差可加”混淆。
  - id: M3.1b
    name: 非负整数随机变量的尾和公式
    prereq: [M3.1]
    content:
      - 若 X 取非负整数，E(X)=sum_{k=1}^∞ P(X≥k)。
      - 用于几何等待、次序统计量、指示变量计数。
      - 尾和公式需要非负整数取值。
      - 可简化期望计算，避免直接求和 x p(x)。
      - 与全期望公式可联用。
  - id: M3.2
    name: 随机变量函数的期望 LOTUS
    prereq: [M3.1]
    content:
      - E(g(X))=sum g(x)p(x)。
      - 分别算 E(X)、E(X^2)、E(4X^2-2X+3)。
      - 利用对称性简化 x=-1,0,1。
      - 不要先求 g(X) 的分布再求期望，除非必要。
      - 线性组合用期望线性性。
  - id: M3.3
    name: 方差、标准差与 E(X^2)-μ^2
    prereq: [M3.1, M3.2]
    content:
      - Var(X)=E[(X-μ)^2]=E(X^2)-μ^2。
      - 标准差 σ=sqrt(Var(X))。
      - 表格计算先算 E(X^2)。
      - Var(aX+b)=a^2 Var(X)。
      - 方差非负；计算后检查。
      - 标准差与原变量同单位。
  - id: M3.4
    name: 线性变换的期望与方差
    prereq: [M3.1, M3.3]
    content:
      - E(aX+b)=aE(X)+b。
      - Var(aX+b)=a^2 Var(X)。
      - sd(aX+b)=|a| sd(X)。
      - 成本 C=13000+2000X。
      - 线性变换不改变分布形状，只平移缩放。
      - 负斜率时标准差取绝对值。
  - id: M3.4a
    name: 线性变换的分布映射
    prereq: [M3.4]
    content:
      - 若 Y=aX+b，a≠0，则 p_Y(y)=p_X((y-b)/a)。
      - 取值集合是 X 的取值平移缩放。
      - E(Y)=aE(X)+b。
      - Var(Y)=a^2 Var(X)，sd(Y)=|a| sd(X)。
      - 用于成本、总价、单位换算等。
      - 注意 a<0 时取值顺序反转。
  - id: M3.5
    name: 概率区间与表格累加
    prereq: [M3.3, M1.8]
    content:
      - 先求 μ,σ。
      - 把 |X-μ|≤2σ 转成区间 [μ-2σ, μ+2σ]。
      - 累加对应 p(x)。
      - 注意端点是否包含。
      - 表格分布用离散取值，不要用连续正态近似。
      - 区间外的概率用 1 减。
  - id: M3.6
    name: 加权平均与 size-biased 抽样
    prereq: [M3.1]
    content:
      - 按班级频率求教授平均：sum n f_n。
      - 学生平均：sum n·(n f_n)/sum n f_n。
      - 大班学生被抽中的概率与其人数成比例。
      - 教授平均与学生平均抽样主体不同。
      - 两者都真实，不矛盾。
      - 加权平均权重必须和为 1。
  - id: M3.7
    name: 次序统计量：最大值 PMF
    prereq: [M2.1, M1.8]
    content:
      - 从 1..N 无放回选 n，最大值 Y=y。
      - 当且仅当选中 y，且其余 n-1 个从 1..y-1 选。
      - P(Y=y)=C(y-1,n-1)/C(N,n)，y=n,...,N。
      - 定义域下限是 n。
      - 检查 PMF 和为 1。
      - 最小值/中位数类似用组合数。
  - id: M3.8
    name: 次序统计量期望/方差与组合求和
    prereq: [M3.7, M0.4]
    content:
      - E(Y)=sum y C(y-1,n-1)/C(N,n)。
      - 用组合恒等式求和。
      - Var(Y)=E(Y^2)-[E(Y)]^2。
      - 可先算 E[Y(Y-1)] 简化。
      - 注意求和上下限。
      - 组合恒等式与二项式定理联用。
  - id: M3.9
    name: 矩母函数 MGF
    prereq: [M3.1, M0.6]
    content:
      - M_X(t)=E(e^{tX})。
      - 离散求和；求导得矩。
      - 收敛域由级数收敛决定。
      - 对数级数分布 MGF 为 ln(1-pe^t)/ln(1-p)，t<-ln p。
      - M_X'(0)=E(X)，M_X''(0)=E(X^2)。
      - 由 MGF 求均值方差。
  - id: M3.9a
    name: MGF 求矩公式与收敛域
    prereq: [M3.9]
    content:
      - M_X(t)=E(e^{tX})。
      - M_X'(0)=E(X)，M_X''(0)=E(X^2)。
      - Var(X)=M_X''(0)-[M_X'(0)]^2。
      - d/dt ln(1-pe^t)=-pe^t/(1-pe^t)。
      - 收敛域由 |pe^t|<1 得 t<-ln p。
      - 对数级数分布先用对数展开验证归一化，再求 MGF。
  - id: M3.10
    name: 指示变量与期望线性
    prereq: [M3.1, M1.8]
    content:
      - I_A 的期望 P(A)。
      - 把计数变量写成指示变量之和。
      - 秘书问题 X=sum I_i 得 E(X)=1。
      - 指示变量之间不一定独立，但期望可加。
      - 求方差时才需要考虑协方差/独立性。
      - 指示变量法适合“恰好/至少”计数。
  - id: M3.11
    name: 条件期望与全期望公式
    prereq: [M3.1, M1.3, M1.8]
    content:
      - 离散条件期望：E(X|Y=y)=sum_x x P(X=x|Y=y)。
      - 全期望公式：E(X)=E[E(X|Y)]=sum_y E(X|Y=y)P(Y=y)。
      - 后验预测：P(R_2|R_1)=E[P(R_2|X,R_1)|R_1]。
      - 条件期望是随机变量 E(X|Y)，再取期望得 E(X)。
      - 用于贝叶斯后验预测、加权平均、条件比较。
      - 全期望公式不需要独立。
  - id: M3.12
    name: 协方差与方差加法
    prereq: [M3.3]
    content:
      - Var(X+Y)=Var(X)+Var(Y)+2Cov(X,Y)。
      - Cov(X,Y)=E(XY)-E(X)E(Y)。
      - 独立 ⇒ 不相关 ⇒ 协方差为 0；反之不成立。
      - 指示变量和的方差需要协方差项。
      - 若指示变量独立则方差相加。
      - 用于理解“独立时方差可加”。
