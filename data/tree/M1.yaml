  # ================= M1 概率基础与条件概率 =================
  - id: M1.1
    name: 样本空间、事件、概率公理
    prereq: [M0.1]
    content:
      - 样本空间 Ω、事件 A⊆Ω。
      - 0≤P(A)≤1，P(Ω)=1，P(∅)=0。
      - 有限等可能古典概型：P(A)=有利结果数/总结果数。
      - 可列可加性：互斥事件并的概率等于概率和。
  - id: M1.2
    name: 补事件、并交事件、包含排除
    prereq: [M1.1]
    content:
      - P(A^c)=1-P(A)。
      - P(A∪B)=P(A)+P(B)-P(A∩B)。
      - 三事件包含排除：
        P(A∪B∪C)=P(A)+P(B)+P(C)-P(A∩B)-P(A∩C)-P(B∩C)+P(A∩B∩C)。
      - P(A∩B)=0 表示互斥。
      - 差乘积为 0 等事件可拆成并事件再算。
      - 补事件常用于“至少一个”。
  - id: M1.2a
    name: 概率单调性、包含关系与概率上界
    prereq: [M1.1, M1.2]
    content:
      - 若 A⊆B，则 P(A)≤P(B)。
      - P(A∩B)≤min(P(A),P(B))。
      - P(A∪B∪C)≤1，且各交事件概率非负。
      - 由包含排除建立参数不等式：并概率≤1，交概率≤单个事件概率。
      - 用于求参数的最大可行值、概率上界、可行性检查。
  - id: M1.3
    name: 条件概率与乘法公式
    prereq: [M1.1]
    content:
      - P(A|B)=P(A∩B)/P(B)，P(B)>0。
      - P(A∩B)=P(A|B)P(B)=P(B|A)P(A)。
      - 条件概率仍满足概率公理。
      - 条件概率中分母是条件事件，不是全集。
      - 多个事件链式相乘：P(A∩B∩C)=P(A)P(B|A)P(C|A∩B)。
  - id: M1.3a
    name: 条件补事件与条件独立
    prereq: [M1.2, M1.3]
    content:
      - P(A^c|B)=1-P(A|B)。
      - 若 P(B'|D')=θ，则 P(B|D')=1-θ。
      - 条件独立：P(A∩B|C)=P(A|C)P(B|C)。
      - 条件独立与无条件独立不同；不能随意互换。
      - 条件概率下仍可用补事件、并交公式、包含排除。
  - id: M1.4
    name: 全概率公式
    prereq: [M1.3]
    content:
      - 设 A_i 互斥且穷尽，P(B)=sum_i P(B|A_i)P(A_i)。
      - 先按原因/类别分割，再对每类算条件概率。
      - 诊断测试先按患病/未患病分割。
      - 全概率公式是贝叶斯公式的分母。
      - 检查分割是否互斥且穷尽。
  - id: M1.5
    name: 贝叶斯公式
    prereq: [M1.3, M1.4]
    content:
      - P(A_i|B)=P(B|A_i)P(A_i)/sum_j P(B|A_j)P(A_j)。
      - 先验、似然、后验、归一化。
      - 后验概率与先验和似然比有关。
      - 反解阈值参数时，把后验写成参数的分式方程。
      - 基础率很低时后验可能远低于直觉。
  - id: M1.6
    name: 独立性
    prereq: [M1.3]
    content:
      - 两事件独立：P(A∩B)=P(A)P(B)。
      - 多个事件相互独立：任意子集的交概率等于各自概率乘积。
      - 独立与互斥不能随意混用；非空事件既独立又互斥通常不可能。
      - 独立时 P(A∪B)=1-(1-P(A))(1-P(B))。
      - 独立重复试验的联合概率逐项相乘。
  - id: M1.7
    name: 互斥、穷尽、等可能及其相容性
    prereq: [M1.2, M1.6]
    content:
      - 互斥：P(A∩B)=0。
      - 穷尽：A∪B=Ω。
      - 等可能：P(A)=P(B)。
      - 判断“既独立又互斥”何时可能：需要 P(A)P(B)=0，即至少一个概率为 0。
      - 判断“既互斥又穷尽”：A 与 A^c 是典型。
      - 判断“既独立又穷尽”：P(A∪B)=P(A)+P(B)-P(A)P(B)=1。
  - id: M1.8
    name: 随机变量、PMF、CDF
    prereq: [M1.1]
    content:
      - 离散随机变量 X 的取值。
      - PMF：p(x)=P(X=x)，sum_x p(x)=1，p(x)≥0。
      - CDF：F(x)=P(X≤x)=sum_{u≤x}p(u)。
      - F 单调不减、右连续，F(-∞)=0，F(+∞)=1。
      - 由 PMF 累加得 CDF；由 CDF 跳跃高度得 PMF。
      - 区间概率：P(a<X≤b)=F(b)-F(a)。
  - id: M1.8a
    name: PMF 同值合并与 CDF 阶梯构造
    prereq: [M1.8]
    content:
      - 不同样本结果可能映射到同一个 X=x，必须把概率合并，不能重复计。
      - 先列 X 的所有可能取值，再对每个值找对应样本组合。
      - CDF：F(x)=sum_{u≤x}p(u)，按 x 从小到大累加。
      - 阶梯函数在 x 处的跳跃高度为 p(x)，右连续。
      - 相邻取值之间 F 保持不变。
      - 检查 F(-∞)=0、F(+∞)=1、单调不减。
      - 写 CDF 时按取值区间分段。
  - id: M1.9
    name: 古典概型与等可能结果
    prereq: [M0.3, M1.1]
    content:
      - 概率=有利结果数/总结果数。
      - 先确定总样本空间是有序还是无序。
      - 分子分母口径必须一致。
      - 复杂事件先分解成简单事件再计数。
      - 等可能假设必须明确；非均匀骰子不能直接数结果数。
  - id: M1.10
    name: 随机变量独立、联合分布与边缘化
    prereq: [M1.6, M1.8]
    content:
      - 离散联合 PMF：p_{X,Y}(x,y)=P(X=x,Y=y)。
      - 边缘化：p_X(x)=sum_y p_{X,Y}(x,y)。
      - 独立随机变量：p_{X,Y}(x,y)=p_X(x)p_Y(y)。
      - 等价于 P(X∈A,Y∈B)=P(X∈A)P(Y∈B)。
      - 若 X,Y 独立，则 E[g(X)h(Y)]=E[g(X)]E[h(Y)]。
      - 期望线性性不需要独立。
      - 多个独立试验的联合概率逐项相乘。
